name: smart_plant_monitoring
description: Secure tomato and potato leaf monitoring application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  camera: ^0.11.0+2
  camera_macos: ^0.1.1
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0
  fl_chart: ^0.70.2
  csv: ^6.0.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  image: ^4.5.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
